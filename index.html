<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: monospace;
      background: black;
      color: #00ff9f;
    }

    .terminal {
      padding: 40px;
      max-width: 900px;
      margin: auto;
      white-space: pre-line;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      background: #00ff9f;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }
  </style>
</head>
<body>

<div class="terminal" id="terminal"></div>

<script>
const text = `
$ about

NGUYEN | MANH | LINH

Year of birth: 1997
Education : Banking Academy
Specialized: Management Information Systems

Current role:
- Business Analyst at Techcombank Vietnam

$ experience

- Business Analyst / Mar 2023 - present
Techcombank Vietnam

- Business Analyst / Mar 2021 - Feb 2023
VNPAY

- Business Analyst / Mar 2019 - Dec 2020
ETC Technology Systems JSC

$ skills

- Information Architecture
- Testing
- Systems Integration
- SQL
- User Requirements
- Microsoft Power BI
- UML
- UI/UX
etc...

$ certs

- TOEIC 900+ - IIG Vietnam
- MOS - IIG Vietnam
- Analyzing and Visualizing Data - Microsoft Power BI

$ contact

Phone : 033 3806394
Facebook: https://facebook.com/manhlinh.nguyen.1803
`;

let i = 0;
const speed = 20;
const terminal = document.getElementById("terminal");

function type() {
  if (i < text.length) {
    terminal.innerHTML += text.charAt(i);
    i++;
    setTimeout(type, speed);
  }
}

type();
</script>

</body>
</html>
